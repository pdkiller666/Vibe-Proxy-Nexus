kind = "web"
previewPath = "/"
title = "VPN Portal"
description = "Приватный VPN-портал для приглашений, подписок, платежей и управления VLESS-ключами."
version = "1.0.0"
id = "artifacts/vpn-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24143

[services.development]
run = "pnpm --filter @workspace/vpn-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vpn-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/vpn-portal/dist/public"

[[services.production.rewrites]]
from = "/terms"
to = "/terms/index.html"

[[services.production.rewrites]]
from = "/privacy"
to = "/privacy/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24143"
BASE_PATH = "/"
