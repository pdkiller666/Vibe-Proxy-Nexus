[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:xray]
command=/usr/local/bin/xray run -config /etc/xray/config.json
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/xray.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/xray.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

[program:mgmt-api]
command=/usr/local/bin/uvicorn api_server:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=/app/bot
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/mgmt-api.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/mgmt-api.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

[program:telegram-bot]
command=/usr/local/bin/python3 telegram_bot.py
directory=/app/bot
autostart=false
autorestart=false
startretries=0
stdout_logfile=/var/log/supervisor/telegram-bot.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/telegram-bot.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
