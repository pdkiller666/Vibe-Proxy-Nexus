# This file is included by Ubuntu's default nginx.conf inside the `http` block.
# It must NOT be moved into a `server` or `location` block.
#
# Empty keys are not counted by limit_conn, so legacy VLESS links using plain
# `/vpnws` are deliberately unaffected. New canary links use
# `/vpnws?sid=<stable-token>` and are limited by the existing /vpnws location.
limit_conn_zone $arg_sid zone=vpn_session_by_sid:10m;