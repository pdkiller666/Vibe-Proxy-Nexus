# Nginx config for a VPN node without a domain (bare IP + self-signed cert).
# Place this file at /etc/nginx/sites-available/vpn-node and symlink to sites-enabled.
#
# TLS termination happens here; Xray listens on 127.0.0.1:10000 (plain WS).
# The management API (port 8443) is exposed directly by the Docker container —
# no Nginx proxy needed for it.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;   # accept connections by bare IP

    ssl_certificate     /etc/nginx/ssl/vpn-node.crt;
    ssl_certificate_key /etc/nginx/ssl/vpn-node.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # VLESS + WebSocket VPN traffic
    location /vpnws {
        proxy_pass         http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # Everything else → 444 (no response) to avoid leaking info
    location / {
        return 444;
    }
}

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}
