# Nginx config for a VPN node on a VPS with a hostname-based Let's Encrypt cert.
#
# SETUP STEPS (first deploy):
#   1. Install certbot:  apt-get install -y certbot python3-certbot-nginx
#   2. Temporarily set server_name to your hostname (e.g. v917715.hosted-by-vdsina.com).
#   3. Run: certbot certonly --nginx -d <your-hostname> --non-interactive --agree-tos --email <your-email>
#   4. Paste the resulting paths below and reload nginx.
#
# For VPS nodes WITHOUT a hostname (bare IP), use a self-signed cert instead:
#   openssl req -x509 -newkey rsa:4096 -keyout /etc/nginx/ssl/vpn-node.key \
#     -out /etc/nginx/ssl/vpn-node.crt -days 3650 -nodes -subj "/CN=<IP>"
# Then set ssl_certificate/ssl_certificate_key to those paths.
# In the admin panel, fill the "Cert SHA256" field with the fingerprint:
#   echo | openssl s_client -connect <IP>:443 2>/dev/null \
#     | openssl x509 -outform DER | openssl dgst -sha256 -binary | base64
#
# TLS termination happens here; Xray listens on 127.0.0.1:10000 (plain WS).
# The management API (port 8443) is exposed directly by the Docker container —
# no Nginx proxy needed for it.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name v917715.hosted-by-vdsina.com;  # ← change to your hostname

    # Let's Encrypt certificate paths (certbot writes these automatically):
    ssl_certificate     /etc/letsencrypt/live/v917715.hosted-by-vdsina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v917715.hosted-by-vdsina.com/privkey.pem;

    # For bare-IP nodes (no domain), replace the two lines above with:
    # ssl_certificate     /etc/nginx/ssl/vpn-node.crt;
    # ssl_certificate_key /etc/nginx/ssl/vpn-node.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # VLESS + WebSocket VPN traffic
    location /vpnws {
        proxy_pass         http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # Everything else → 444 (no response) to avoid leaking info
    location / {
        return 444;
    }
}

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name v917715.hosted-by-vdsina.com;  # ← change to your hostname
    return 301 https://$host$request_uri;
}
