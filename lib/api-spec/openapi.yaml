openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: me
    description: Current user
  - name: plans
    description: Subscription plans
  - name: payments
    description: Payments
  - name: subscriptions
    description: Subscriptions
  - name: vpn-keys
    description: VPN keys
  - name: vpn-nodes
    description: VPN nodes
  - name: support
    description: Support tickets
  - name: notifications
    description: User in-app notifications
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "200":
          description: Registered and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Start a password reset for the given email, if an account exists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset started (response is intentionally generic to avoid leaking account existence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResult"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Complete a password reset using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResult"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update the current user's display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /me/email:
    patch:
      operationId: changeMyEmail
      tags: [me]
      summary: Change the current user's login email (requires current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /me/password:
    patch:
      operationId: changeMyPassword
      tags: [me]
      summary: Change the current user's password (requires current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResult"

  /me/auto-renew:
    patch:
      operationId: patchMeAutoRenew
      tags: [me]
      summary: Enable or disable automatic monthly renewal from balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoRenewInput"
      responses:
        "200":
          description: Updated preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /balance-checkout:
    post:
      operationId: postBalanceCheckout
      tags: [payments]
      summary: Pay for a subscription, extra device slot, or extra traffic from the wallet balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceCheckoutInput"
      responses:
        "200":
          description: Payment confirmed and item activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceCheckoutResult"
        "400":
          description: Invalid request (hourly plan, zero price, no active subscription, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Feature flag disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List subscription plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /payment-settings:
    get:
      operationId: getPaymentSettings
      tags: [payments]
      summary: Get payment instructions (SBP details)
      responses:
        "200":
          description: Payment settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"

  /vpn-nodes:
    get:
      operationId: listVpnNodes
      tags: [vpn-nodes]
      summary: List available VPN nodes/locations
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VpnNode"

  /subscriptions/me:
    get:
      operationId: listMySubscriptions
      tags: [subscriptions]
      summary: List current user's subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"

  /subscriptions:
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Start a subscription checkout (creates pending subscription + payment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"

  /payments/me:
    get:
      operationId: listMyPayments
      tags: [payments]
      summary: List current user's payments
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments/{paymentId}/note:
    patch:
      operationId: updatePaymentNote
      tags: [payments]
      summary: Attach a transfer note/reference to a pending payment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentNoteUpdate"
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{paymentId}/screenshot:
    patch:
      operationId: updatePaymentScreenshot
      tags: [payments]
      summary: Attach a payment confirmation screenshot to a pending payment
      description: |
        The screenshot is stored directly in Postgres as base64 (this app
        runs as a single Docker container outside Replit, so no external
        object storage is used).
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentScreenshotUpdate"
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{paymentId}/screenshot/image:
    get:
      operationId: getPaymentScreenshot
      tags: [payments]
      summary: Serve a payment's confirmation screenshot
      description: |
        Requires an authenticated session; a user may only view their own
        screenshot unless they are an admin.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Image content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Screenshot not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /balance-transactions/me:
    get:
      operationId: listMyBalanceTransactions
      tags: [payments]
      summary: List current user's balance transaction history (top-ups, hourly debits, refunds)
      responses:
        "200":
          description: List of balance transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceTransaction"

  /vpn-keys/me:
    get:
      operationId: listMyVpnKeys
      tags: [vpn-keys]
      summary: List current user's VPN keys
      responses:
        "200":
          description: List of VPN keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VpnKey"

  /vpn-keys:
    post:
      operationId: createVpnKey
      tags: [vpn-keys]
      summary: Issue a new VPN key on a node (requires an active subscription)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VpnKeyInput"
      responses:
        "201":
          description: Issued VPN key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnKey"

  /vpn-keys/{keyId}:
    patch:
      operationId: updateVpnKey
      tags: [vpn-keys]
      summary: Rename a VPN key (label/description)
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VpnKeyRenameInput"
      responses:
        "200":
          description: Updated VPN key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnKey"
    delete:
      operationId: revokeVpnKey
      tags: [vpn-keys]
      summary: Revoke a VPN key
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked

  /vpn-keys/{keyId}/relocate:
    post:
      operationId: relocateVpnKey
      tags: [vpn-keys]
      summary: >-
        Move a VPN key to a different node. Revokes the old key and issues a
        new one on the target node (same label/description). Returns the new key.
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VpnKeyRelocateInput"
      responses:
        "200":
          description: New VPN key issued on the target node (old key revoked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnKey"
        "400":
          description: Bad request (e.g. same node)
        "403":
          description: No active subscription or traffic limit exceeded
        "404":
          description: Key or target node not found
        "409":
          description: Target node at capacity

  /vpn-keys/subscription-url:
    get:
      operationId: getSubscriptionUrl
      tags: [vpn-keys]
      summary: >-
        Get the current user's stable subscription URL (a self-updating link
        that aggregates all of the user's active VPN keys — add it once in the
        client app instead of pasting individual vless links).
      responses:
        "200":
          description: Subscription URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionUrl"

  /balance-topup-order:
    post:
      operationId: createBalanceTopupOrder
      tags: [payments]
      summary: Start a balance top-up payment via SBP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceTopupOrderBody"
      responses:
        "201":
          description: Created top-up order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceTopupOrderResult"

  /balance-topup-order/{paymentId}:
    delete:
      operationId: deleteBalanceTopupOrder
      tags: [payments]
      summary: Cancel a pending balance top-up order
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBalanceTopupOrderResult"

  /extra-slot-order:
    post:
      operationId: createExtraSlotOrder
      tags: [payments]
      summary: Start a checkout for an extra VPN device slot (requires an active subscription)
      responses:
        "201":
          description: Created checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtraSlotOrderResult"

  /extra-slot-order/{paymentId}:
    delete:
      operationId: deleteExtraSlotOrder
      tags: [payments]
      summary: Cancel a pending extra device slot order
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelExtraSlotOrderResult"

  /extra-traffic-order:
    post:
      operationId: createExtraTrafficOrder
      tags: [payments]
      summary: Start a checkout for an extra traffic package (requires an active subscription with a traffic cap)
      responses:
        "201":
          description: Created checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtraTrafficOrderResult"

  /extra-traffic-order/{paymentId}:
    delete:
      operationId: deleteExtraTrafficOrder
      tags: [payments]
      summary: Cancel a pending extra traffic order
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelExtraTrafficOrderResult"

  /notifications:
    get:
      operationId: listMyNotifications
      tags: [notifications]
      summary: List current user's unacknowledged in-app notifications
      responses:
        "200":
          description: List of unacknowledged notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotificationList"

  /notifications/{id}/acknowledge:
    post:
      operationId: acknowledgeNotification
      tags: [notifications]
      summary: Dismiss an in-app notification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotificationAcknowledgeResult"
        "404":
          description: Notification not found

  /support-tickets:
    get:
      operationId: listMyTickets
      tags: [support]
      summary: List current user's support tickets
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Create a support ticket with an initial message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketCreateInput"
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketBase"

  /support-tickets/{ticketId}:
    get:
      operationId: getTicket
      tags: [support]
      summary: Get a ticket with its messages
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"

  /support-tickets/{ticketId}/messages:
    post:
      operationId: addTicketMessage
      tags: [support]
      summary: Add a message to a ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageInput"
      responses:
        "201":
          description: Added message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"

  /admin/dashboard/summary:
    get:
      operationId: getAdminDashboardSummary
      tags: [admin]
      summary: Admin dashboard summary metrics
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /admin/plans:
    get:
      operationId: listAdminPlans
      tags: [admin]
      summary: List all plans including promo (admin only)
      responses:
        "200":
          description: All plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [admin]
      summary: Create a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /admin/plans/{planId}:
    patch:
      operationId: updatePlan
      tags: [admin]
      summary: Update a plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: deletePlan
      tags: [admin]
      summary: Delete a plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/payment-settings/sbp-qr:
    put:
      operationId: uploadSbpQr
      tags: [admin]
      summary: Upload SBP QR code image (base64)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SbpQrUpload"
      responses:
        "200":
          description: OK
    delete:
      operationId: deleteSbpQr
      tags: [admin]
      summary: Delete SBP QR code image
      responses:
        "200":
          description: OK

  /admin/payment-settings:
    patch:
      operationId: updatePaymentSettings
      tags: [admin]
      summary: Update SBP payment instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"

  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin]
      summary: List payments (optionally filtered by status and/or userId)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - name: userId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPayment"

  /admin/payments/{paymentId}/confirm:
    post:
      operationId: confirmPayment
      tags: [admin]
      summary: Confirm a payment and activate the subscription
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Confirmed payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /admin/payments/{paymentId}/reject:
    post:
      operationId: rejectPayment
      tags: [admin]
      summary: Reject a payment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentReject"
      responses:
        "200":
          description: Rejected payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /admin/vpn-nodes/provision:
    post:
      operationId: provisionVpnNode
      tags: [admin]
      summary: Start automated SSH provisioning of a new VPN node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VpnNodeProvisionInput"
      responses:
        "202":
          description: Provisioning job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnNodeProvisionStarted"

  /admin/vpn-nodes:
    post:
      operationId: createVpnNode
      tags: [admin]
      summary: Register a VPN node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VpnNodeInput"
      responses:
        "201":
          description: Created node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnNode"

  /admin/vpn-nodes/{nodeId}:
    patch:
      operationId: updateVpnNode
      tags: [admin]
      summary: Update a VPN node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VpnNodeUpdate"
      responses:
        "200":
          description: Updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnNode"
    delete:
      operationId: deleteVpnNode
      tags: [admin]
      summary: Delete a VPN node and migrate its active keys to other nodes
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted; includes key migration summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteVpnNodeResult"

  /admin/referrals:
    get:
      operationId: listAdminReferrals
      tags: [admin]
      summary: List referrers with their stats
      responses:
        "200":
          description: Referral stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminReferralEntry"

  /admin/invite-links:
    get:
      operationId: listAdminInviteLinks
      tags: [admin]
      summary: List admin-created invite links
      responses:
        "200":
          description: List of invite links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminInviteLink"
    post:
      operationId: createAdminInviteLink
      tags: [admin]
      summary: Create an admin invite link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInviteLinkCreateInput"
      responses:
        "201":
          description: Created invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInviteLink"

  /admin/invite-links/{linkId}/users:
    get:
      operationId: getAdminInviteLinkUsers
      tags: [admin]
      summary: List users who registered via an admin invite link
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of users registered via this invite link
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminInviteLinkUser"

  /admin/invite-links/{linkId}:
    patch:
      operationId: updateAdminInviteLink
      tags: [admin]
      summary: Update an admin invite link (note, isActive, planId, trialDays, maxUses, expiresAt)
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInviteLinkUpdateInput"
      responses:
        "200":
          description: Updated invite link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInviteLink"
    delete:
      operationId: deleteAdminInviteLink
      tags: [admin]
      summary: Delete an admin invite link
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/notifications:
    get:
      operationId: getAdminNotifications
      tags: [admin]
      summary: Recent payment events for polling-based notifications
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Notification events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminNotification"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/vpn-keys:
    get:
      operationId: listAdminVpnKeys
      tags: [admin]
      summary: List VPN keys (optionally filtered by userId)
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of VPN keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VpnKey"

  /admin/vpn-keys/{keyId}:
    delete:
      operationId: revokeAdminVpnKey
      tags: [admin]
      summary: Revoke a VPN key
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked

  /admin/users/{userId}/password-reset:
    post:
      operationId: adminResetUserPassword
      tags: [admin]
      summary: Generate a one-time password reset link for a user (admin-assisted reset, no email sending configured)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reset link generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordResetResult"

  /admin/users/{userId}:
    patch:
      operationId: updateUserProfile
      tags: [admin]
      summary: Edit a user's name and/or email
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Permanently delete a user and all of their data (keys, subscriptions, payments, tickets)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/users/{userId}/role:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Update a user's role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}/subscription:
    patch:
      operationId: updateUserSubscription
      tags: [admin]
      summary: Manually assign/change a user's plan and (re)activate or extend their subscription
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSubscriptionUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}/extra-slots:
    patch:
      operationId: updateUserExtraSlots
      tags: [admin]
      summary: Set a user's extra device slot count
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSlotsUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}/balance:
    patch:
      operationId: adminSetUserBalance
      tags: [admin]
      summary: Set a user's balance directly (in kopecks)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetUserBalanceRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}/set-password:
    patch:
      operationId: adminSetUserPassword
      tags: [admin]
      summary: Set a new password for a user (admin override, invalidates all sessions)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetUserPasswordRequest"
      responses:
        "204":
          description: Password updated

  /admin/users/{userId}/force-logout:
    post:
      operationId: adminForceLogout
      tags: [admin]
      summary: Invalidate all active sessions for a user (force sign-out on all devices)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Sessions cleared

  /admin/users/{userId}/ban:
    post:
      operationId: adminBanUser
      tags: [admin]
      summary: Block a user account (revokes VPN keys and forces sign-out)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User banned

  /admin/users/{userId}/unban:
    post:
      operationId: adminUnbanUser
      tags: [admin]
      summary: Unblock a user account (restores VPN access if subscription is active)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User unbanned

  /admin/users/{userId}/note:
    patch:
      operationId: adminSetUserNote
      tags: [admin]
      summary: Update the private admin note for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserNoteUpdate"
      responses:
        "204":
          description: Note saved

  /admin/users/{userId}/balance-transactions:
    get:
      operationId: listAdminUserBalanceTransactions
      tags: [admin]
      summary: Balance transaction history for a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of balance transactions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBalanceTransaction"

  /admin/system-events:
    get:
      operationId: listAdminSystemEvents
      tags: [admin]
      summary: List unacknowledged system events (e.g. Xray config remounts)
      responses:
        "200":
          description: List of unacknowledged system events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemEventList"

  /admin/system-events/{eventId}/acknowledge:
    post:
      operationId: acknowledgeAdminSystemEvent
      tags: [admin]
      summary: Acknowledge (dismiss) a system event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemEventAcknowledgeResult"
        "404":
          description: Event not found

  /admin/health/traffic-polling:
    get:
      operationId: getAdminTrafficPollingHealth
      tags: [admin]
      summary: Get traffic polling health status (last success time + consecutive failure count)
      responses:
        "200":
          description: Traffic polling health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficPollingHealth"

  /admin/vpn-nodes/{nodeId}/health:
    get:
      operationId: getVpnNodeHealth
      tags: [admin]
      summary: Ping a VPN node's management API and return its health status
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Health result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnNodeHealthResult"

  /admin/vpn-nodes/{nodeId}/system/status:
    get:
      operationId: getVpnNodeSystemStatus
      tags: [admin]
      summary: Get CPU, RAM, disk and uptime for a VPN node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnNodeSystemStatus"

  /admin/vpn-nodes/{nodeId}/system/metrics:
    get:
      operationId: getVpnNodeMetrics
      tags: [admin]
      summary: Get historical CPU, RAM, or disk usage for a VPN node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [cpu, ram, disk]
        - name: from
          in: query
          required: false
          description: ISO-8601 start timestamp (inclusive). Defaults to 30 days ago.
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: ISO-8601 end timestamp (inclusive). Defaults to now.
          schema:
            type: string
      responses:
        "200":
          description: Time-series data points (aggregated by hour when range > 7 days)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnNodeMetricsResponse"

  /admin/vpn-nodes/{nodeId}/system/logs:
    get:
      operationId: getVpnNodeSystemLogs
      tags: [admin]
      summary: Get recent stdout log lines for a process on a VPN node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
        - name: process
          in: query
          required: false
          schema:
            type: string
            enum: [xray, mgmt-api]
            default: xray
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Log lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnNodeSystemLogs"

  /admin/vpn-nodes/{nodeId}/system/restart-xray:
    post:
      operationId: restartVpnNodeXray
      tags: [admin]
      summary: Restart the Xray process on a VPN node via supervisorctl
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restart result with refreshed system status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnNodeRestartXrayResult"

  /admin/support-tickets:
    get:
      operationId: listAdminTickets
      tags: [admin]
      summary: List all support tickets (optionally filtered by status)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TicketStatusFilter"
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"

  /admin/support-tickets/{ticketId}:
    get:
      operationId: getAdminTicket
      tags: [admin]
      summary: Get a ticket with its messages
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"

  /admin/support-tickets/{ticketId}/messages:
    post:
      operationId: adminAddTicketMessage
      tags: [admin]
      summary: Reply to a ticket as an admin
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageInput"
      responses:
        "201":
          description: Added message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"

  /admin/support-tickets/{ticketId}/status:
    patch:
      operationId: updateTicketStatus
      tags: [admin]
      summary: Update a ticket's status
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketStatusUpdate"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketBase"

  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
      summary: List admin audit log entries with filtering and pagination
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: adminId, in: query, schema: { type: integer } }
        - name: action
          in: query
          schema:
            $ref: "#/components/schemas/AdminAuditLogAction"
        - { name: targetType, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: integer } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv] } }
      responses:
        "200":
          description: JSON (default) or CSV stream (when format=csv)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogListResponse"
            text/csv:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserRole:
      type: string
      enum: [user, admin]

    RegisterInput:
      type: object
      required: [email, password, ref]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
        name: { type: string }
        # Invite-only signup: must match an existing user's referralCode.
        # There is no bootstrap exception — the seeded admin account already
        # has one, so it's the root of every invite chain.
        ref: { type: string, minLength: 1 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ForgotPasswordResult:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1 }
        password: { type: string, minLength: 8, maxLength: 200 }

    ResetPasswordResult:
      type: object
      required: [message]
      properties:
        message: { type: string }

    UpdateMeInput:
      type: object
      properties:
        name: { type: ["string", "null"] }

    ChangeEmailInput:
      type: object
      required: [newEmail, currentPassword]
      properties:
        newEmail: { type: string, format: email }
        currentPassword: { type: string, minLength: 1, maxLength: 200 }

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 200 }
        newPassword: { type: string, minLength: 8, maxLength: 200 }

    ChangePasswordResult:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Me:
      type: object
      required:
        [
          id,
          email,
          role,
          hasActiveSubscription,
          deviceSlots,
          activeKeyCount,
          balanceKopecks,
          referralCode,
          referralCommissionPercent,
          referralEarningsKopecks,
          referredUserCount,
          referralLinkHost,
          extraTrafficGb,
          trafficLimitExceeded,
          isBanned,
          isTrialSubscription,
          autoRenewFromBalance,
        ]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: ["string", "null"] }
        role:
          $ref: "#/components/schemas/UserRole"
        hasActiveSubscription: { type: boolean }
        currentPlanName: { type: ["string", "null"] }
        subscriptionEndsAt: { type: ["string", "null"], format: date-time }
        currentPlanBillingType:
          oneOf:
            - $ref: "#/components/schemas/PlanBillingType"
            - type: "null"
        hourlyRateKopecks: { type: ["integer", "null"] }
        lastBilledAt: { type: ["string", "null"], format: date-time }
        deviceSlots: { type: integer }
        activeKeyCount: { type: integer }
        balanceKopecks: { type: integer }
        # Effective traffic cap for the current plan's period, in gigabytes —
        # already includes any self-service top-up (extraTrafficGb). Null
        # when there is no active subscription or the plan has no cap.
        trafficLimitGb: { type: ["integer", "null"] }
        # Extra traffic (GB) purchased on top of the plan's base allowance
        # for the current subscription period. 0 if none bought.
        extraTrafficGb: { type: integer }
        # true once the current subscription's period usage has exceeded its
        # effective traffic cap — new VPN key issuance is blocked while this
        # is true (see keyIssuance.ts isTrafficLimitBlocked). Cleared by
        # buying extra traffic or by the subscription renewing.
        trafficLimitExceeded: { type: boolean }
        # Sum of periodUpBytes + periodDownBytes across all of the user's
        # non-revoked VPN keys, for showing usage vs trafficLimitGb.
        periodUsageBytes: { type: integer }
        # Personal invite code, shown as a shareable link in the profile.
        referralCode: { type: string }
        # % of a referral's confirmed subscription payment credited to this
        # user's wallet — pulled live from payment_settings, so it reflects
        # the current admin-configured rate, not a snapshot.
        referralCommissionPercent: { type: integer }
        # Sum of all "referral" balance_transactions ever credited to this
        # user (kopecks). Lifetime total, not tied to a billing period.
        referralEarningsKopecks: { type: integer }
        # Number of accounts registered using this user's referral code.
        referredUserCount: { type: integer }
        # Host to build the shareable referral link against: the
        # admin-configured primary public domain if it's currently healthy,
        # otherwise the request's own (technical) host as a safety-net
        # fallback. Frontend must use this instead of window.location.origin.
        referralLinkHost: { type: string }
        # true while the account is administratively blocked. The frontend
        # must show a "banned" screen rather than redirecting to sign-in.
        isBanned: { type: boolean }
        # true when the user's current active subscription was never backed by a
        # completed payment — i.e. it is a free trial granted at registration.
        # Always false when hasActiveSubscription is false.
        isTrialSubscription: { type: boolean }
        # Opt-in automatic monthly renewal from the wallet balance.
        # When true the autoRenewJob debits the plan price ~24 h before expiry.
        autoRenewFromBalance: { type: boolean }

    PlanBillingType:
      type: string
      enum: [monthly, hourly]

    Plan:
      type: object
      required: [id, name, priceRub, durationDays, devicesIncluded, trafficLimitGb, billingType, hourlyRateKopecks, isActive]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        priceRub: { type: integer }
        durationDays: { type: integer }
        devicesIncluded: { type: integer }
        # Traffic cap per subscription period, in gigabytes. Null = unlimited.
        trafficLimitGb: { type: ["integer", "null"] }
        billingType:
          $ref: "#/components/schemas/PlanBillingType"
        # Per-hour rate in kopecks, billed automatically in 5-minute
        # increments while the user's VPN client is actually sending
        # traffic. Null for monthly plans.
        hourlyRateKopecks: { type: ["integer", "null"] }
        isActive: { type: boolean }
        # Promo plans are hidden from the public plan listing and can only be
        # assigned via admin invite links. Use for referral campaigns or
        # limited-time offers without polluting the public plan-selection page.
        isPromo: { type: boolean }
        # Maximum times a single user may purchase this plan (null = unlimited).
        maxUses: { type: ["integer", "null"] }
        # How many times the currently authenticated user has already activated
        # this plan (counts confirmed subscriptions). null when unauthenticated
        # or not applicable (non-promo public plans).
        userUsedCount: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }

    PlanInput:
      type: object
      required: [name, priceRub, durationDays]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        priceRub: { type: integer, minimum: 0 }
        # 0 is valid for hourly plans, which don't use a fixed duration
        # (billed continuously from balance instead — see hourlyBilling.ts).
        durationDays: { type: integer, minimum: 0 }
        devicesIncluded: { type: integer, minimum: 1 }
        trafficLimitGb: { type: ["integer", "null"], minimum: 1 }
        billingType:
          $ref: "#/components/schemas/PlanBillingType"
        hourlyRateKopecks: { type: ["integer", "null"], minimum: 1 }
        isActive: { type: boolean }
        isPromo: { type: boolean }
        # null clears the limit (unlimited). Minimum 1 when set.
        maxUses: { type: ["integer", "null"], minimum: 1 }

    PlanUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        priceRub: { type: integer, minimum: 0 }
        durationDays: { type: integer, minimum: 0 }
        devicesIncluded: { type: integer, minimum: 1 }
        trafficLimitGb: { type: ["integer", "null"], minimum: 1 }
        billingType:
          $ref: "#/components/schemas/PlanBillingType"
        hourlyRateKopecks: { type: ["integer", "null"], minimum: 1 }
        isActive: { type: boolean }
        isPromo: { type: boolean }
        maxUses: { type: ["integer", "null"], minimum: 1 }

    SbpQrUpload:
      type: object
      required: [data, mimeType]
      properties:
        data: { type: string }
        mimeType: { type: string }

    AppDownloadLinks:
      type: object
      description: Admin-configurable download links for recommended VPN client apps.
      required: [happAndroid, happIos, v2rayng, v2rayn]
      properties:
        happAndroid:
          type: string
          description: Happ for Android (Google Play or direct APK URL)
        happIos:
          type: string
          description: Happ for iOS (App Store URL)
        v2rayng:
          type: string
          description: v2rayNG for Android (Google Play URL)
        v2rayn:
          type: string
          description: v2rayN for Windows (GitHub releases URL)

    HappIosRoutingProfile:
      type: object
      description: >
        Admin-editable subset of the Happ iOS routing profile.
        The API merges this with fixed infrastructure defaults (DNS, geoip URLs,
        etc.) when building the happ://routing/add/<base64> deep link.
      required: [name, directsites, directip]
      properties:
        name:
          type: string
          description: Profile name displayed in Happ (e.g. "VPNexus")
        directsites:
          type: array
          items: { type: string }
          description: >
            Xray domain-matcher rules for sites that bypass the tunnel.
            Format: "domain:example.ru" or "regexp:\\.ru$"
        directip:
          type: array
          items: { type: string }
          description: CIDR blocks that bypass the tunnel (e.g. "10.0.0.0/8")

    PaymentSettings:
      type: object
      required: [sbpPhone, sbpBank, sbpRecipientName, extraDeviceSlotPriceRub, allowFreeExtraDeviceSlot, extraTrafficPriceRub, extraTrafficPackageGb, allowFreeExtraTraffic, trialEnabled, trialDays, sbpPaymentUrl, showManualSbpDetails, hasSbpQr, yookassaEnabled, sbpEnabled, primaryDomainHealthy, happIosRoutingUrl, happIosRoutingProfile, appDownloadLinks, balancePaymentsEnabled]
      properties:
        sbpPhone: { type: string }
        sbpBank: { type: string }
        sbpRecipientName: { type: string }
        instructions: { type: ["string", "null"] }
        # Payment-method visibility toggles — admin can enable/disable each
        # payment tile on checkout pages independently.
        yookassaEnabled: { type: boolean }
        sbpEnabled: { type: boolean }
        extraDeviceSlotPriceRub: { type: integer }
        allowFreeExtraDeviceSlot: { type: boolean }
        # Self-service traffic top-up pricing — see paymentSettings schema
        # comment. Price for one package of extraTrafficPackageGb gigabytes.
        extraTrafficPriceRub: { type: integer }
        extraTrafficPackageGb: { type: integer }
        allowFreeExtraTraffic: { type: boolean }
        trialEnabled: { type: boolean }
        trialDays: { type: integer }
        # Which plan is assigned during trial (null = auto: cheapest active monthly plan).
        trialPlanId: { type: ["integer", "null"] }
        # Minimum wallet balance (in rubles) a user must top up before an
        # hourly plan can be activated. 0 = no minimum required.
        minHourlyTopupRub: { type: integer }
        # Public-facing domain embedded in subscription/vless links when it's
        # healthy (e.g. "vpnexus.pro"). Admin-editable so it can be swapped
        # instantly (without a redeploy) if the domain is ever blocked.
        # Empty string means "use the built-in default".
        primaryDomain: { type: string }
        # % of a referred user's confirmed subscription payment credited to
        # the referrer's wallet balance. 0 disables referral payouts.
        referralCommissionPercent: { type: integer }
        # SBP settings: URL for the payment button (empty = use hardcoded default).
        sbpPaymentUrl: { type: string }
        # Whether to show the old phone/bank/recipient CopyField block on
        # checkout pages. Hidden by default; admin enables when needed.
        showManualSbpDetails: { type: boolean }
        # Whether a QR code image is currently stored (true = /payment-settings/sbp-qr-image is available).
        hasSbpQr: { type: boolean }
        # Feature flag: when false the "pay from balance" button is hidden
        # and POST /balance-checkout returns 409.
        balancePaymentsEnabled: { type: boolean }
        # Live health of the currently-configured primary domain. False means the
        # server's outbound healthz check failed, which typically indicates the
        # domain is blocked or misconfigured. Useful for admin alerting.
        primaryDomainHealthy: { type: boolean }
        # Ready-to-use happ://routing/add/<base64> deep link for iOS Happ users.
        # Always present — falls back to built-in defaults when no custom profile
        # is stored. Clients display this as a button; iOS Happ opens on tap.
        happIosRoutingUrl: { type: string }
        # The effective routing profile currently in use (custom or merged defaults).
        # Admin reads this to populate the editing form; never null in the response.
        happIosRoutingProfile:
          $ref: "#/components/schemas/HappIosRoutingProfile"
        # Effective download links for recommended client apps (custom or built-in defaults).
        # Never null in the response.
        appDownloadLinks:
          $ref: "#/components/schemas/AppDownloadLinks"

    PaymentSettingsUpdate:
      type: object
      properties:
        sbpPhone: { type: string }
        sbpBank: { type: string }
        sbpRecipientName: { type: string }
        instructions: { type: string }
        yookassaEnabled: { type: boolean }
        sbpEnabled: { type: boolean }
        extraDeviceSlotPriceRub: { type: integer, minimum: 0 }
        allowFreeExtraDeviceSlot: { type: boolean }
        extraTrafficPriceRub: { type: integer, minimum: 0 }
        extraTrafficPackageGb: { type: integer, minimum: 1 }
        allowFreeExtraTraffic: { type: boolean }
        trialEnabled: { type: boolean }
        trialDays: { type: integer, minimum: 1, maximum: 365 }
        # null clears the explicit plan choice and reverts to auto-select (cheapest monthly).
        trialPlanId: { type: ["integer", "null"] }
        minHourlyTopupRub: { type: integer, minimum: 0 }
        primaryDomain: { type: string }
        referralCommissionPercent: { type: integer, minimum: 0, maximum: 100 }
        sbpPaymentUrl: { type: string }
        showManualSbpDetails: { type: boolean }
        # Admin-editable iOS Happ routing profile. Pass null to reset to defaults.
        happIosRoutingProfile:
          oneOf:
            - $ref: "#/components/schemas/HappIosRoutingProfile"
            - type: "null"
        # Admin-editable app download links. Pass null to reset to defaults.
        appDownloadLinks:
          oneOf:
            - $ref: "#/components/schemas/AppDownloadLinks"
            - type: "null"
        # Feature flag: enable/disable balance payments without a redeploy.
        balancePaymentsEnabled: { type: boolean }

    AutoRenewInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    BalanceCheckoutInput:
      type: object
      required: [target]
      properties:
        target:
          type: string
          enum: [subscription, extra_device_slot, extra_traffic]
        # Required when target=subscription
        planId: { type: integer }

    BalanceCheckoutResult:
      type: object
      required: [paymentId, type, amountRub]
      properties:
        paymentId: { type: integer }
        type:
          $ref: "#/components/schemas/PaymentType"
        amountRub: { type: integer }
        # Populated when target=subscription
        subscription:
          oneOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"

    SubscriptionStatus:
      type: string
      enum: [pending_payment, active, expired, cancelled, rejected]

    Subscription:
      type: object
      required: [id, planId, plan, status, createdAt]
      properties:
        id: { type: integer }
        planId: { type: integer }
        plan:
          $ref: "#/components/schemas/Plan"
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        startsAt: { type: ["string", "null"], format: date-time }
        endsAt: { type: ["string", "null"], format: date-time }
        # Hourly plans only: how far usage has already been charged. Null
        # means no usage has been billed yet (device hasn't connected).
        lastBilledAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    SubscriptionInput:
      type: object
      required: [planId]
      properties:
        planId: { type: integer }
        provider:
          $ref: "#/components/schemas/PaymentProvider"

    PaymentProvider:
      type: string
      # freekassa is legacy-read-only: integration removed 2026-07-17, kept so
      # historical payment rows still serialize/validate.
      # balance: instant debit from the user's wallet balance (no moderation queue).
      enum: [manual_sbp, yookassa, yoomoney, freekassa, balance]

    PaymentStatus:
      type: string
      enum: [pending, confirmed, rejected]

    PaymentType:
      type: string
      enum: [subscription, extra_device_slot, balance_topup, extra_traffic]

    Payment:
      type: object
      required: [id, subscriptionId, type, provider, amountRub, status, reference, createdAt]
      properties:
        id: { type: integer }
        subscriptionId: { type: ["integer", "null"] }
        type:
          $ref: "#/components/schemas/PaymentType"
        provider:
          $ref: "#/components/schemas/PaymentProvider"
        amountRub: { type: integer }
        # For type === extra_traffic only: how many GB this order grants.
        extraTrafficGb: { type: ["integer", "null"] }
        status:
          $ref: "#/components/schemas/PaymentStatus"
        reference: { type: string }
        userNote: { type: ["string", "null"] }
        # Whether the user has attached a payment confirmation screenshot.
        # The image itself is fetched separately via GET .../screenshot/image.
        hasScreenshot: { type: boolean }
        rejectionReason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: ["string", "null"], format: date-time }

    AdminPayment:
      type: object
      required:
        [id, subscriptionId, userId, userEmail, planName, type, provider, amountRub, status, reference, createdAt]
      properties:
        id: { type: integer }
        subscriptionId: { type: ["integer", "null"] }
        userId: { type: integer }
        userEmail: { type: string }
        planName: { type: ["string", "null"] }
        type:
          $ref: "#/components/schemas/PaymentType"
        provider:
          $ref: "#/components/schemas/PaymentProvider"
        amountRub: { type: integer }
        extraTrafficGb: { type: ["integer", "null"] }
        status:
          $ref: "#/components/schemas/PaymentStatus"
        reference: { type: string }
        userNote: { type: ["string", "null"] }
        hasScreenshot: { type: boolean }
        rejectionReason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: ["string", "null"], format: date-time }

    PaymentNoteUpdate:
      type: object
      required: [userNote]
      properties:
        userNote: { type: string, minLength: 0 }

    PaymentScreenshotUpdate:
      type: object
      required: [data, mimeType]
      properties:
        data:
          type: string
          minLength: 1
          description: "Base64-encoded image bytes (no data: URL prefix)."
        mimeType:
          type: string
          minLength: 1
          description: MIME type of the image (e.g. `image/jpeg`).

    PaymentReject:
      type: object
      properties:
        reason: { type: string }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    CheckoutResult:
      type: object
      required: [subscription, payment]
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
        # Null when activating an hourly plan: those are paid from the
        # user's balance as usage accrues, so there's no upfront payment
        # record to confirm.
        payment:
          oneOf:
            - $ref: "#/components/schemas/Payment"
            - type: "null"

    VpnNode:
      type: object
      required: [id, name, region, sni, isActive]
      properties:
        id: { type: integer }
        name: { type: string }
        region: { type: string }
        host: { type: ["string", "null"] }
        port: { type: integer }
        sni: { type: string }
        # Exposed so the admin UI can show remote vs local node status.
        # managementApiSecret is intentionally NOT exposed for security.
        managementApiUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        maxUsers: { type: ["integer", "null"] }
        activeUserCount: { type: integer }
        flagEmoji: { type: ["string", "null"] }
        # SHA-256 of the node's TLS cert (DER, base64). Required for bare-IP nodes
        # with self-signed certs; modern Xray cores use this instead of allowInsecure.
        certSha256: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    VpnNodeInput:
      type: object
      required: [name, region, sni]
      properties:
        name: { type: string, minLength: 1 }
        region: { type: string, minLength: 1 }
        host: { type: string }
        port: { type: integer }
        managementApiUrl: { type: string }
        managementApiSecret: { type: string }
        publicKey: { type: string }
        shortId: { type: string }
        sni: { type: string, minLength: 1 }
        isActive: { type: boolean }
        maxUsers: { type: ["integer", "null"], minimum: 1 }
        certSha256: { type: string }

    VpnNodeProvisionInput:
      type: object
      required: [sshHost, sshUser, sshPassword, domain, nodeName, nodeRegion]
      properties:
        sshHost:     { type: string, description: "IP address of the VPS" }
        sshUser:     { type: string, description: "SSH username (usually root)" }
        sshPassword: { type: string, description: "SSH password (used once, never stored)" }
        domain:      { type: string, description: "Technical domain pointing to the VPS IP" }
        nodeName:    { type: string, minLength: 1 }
        nodeRegion:  { type: string, minLength: 1 }

    VpnNodeProvisionStarted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }

    VpnNodeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        region: { type: string, minLength: 1 }
        host: { type: string }
        port: { type: integer }
        managementApiUrl: { type: string }
        managementApiSecret: { type: string }
        publicKey: { type: string }
        shortId: { type: string }
        sni: { type: string, minLength: 1 }
        isActive: { type: boolean }
        maxUsers: { type: ["integer", "null"], minimum: 1 }
        # null = explicitly clear the pinned cert (revert to allowInsecure for IP nodes)
        certSha256: { type: ["string", "null"] }

    RevokedReason:
      type: string
      enum: [user, admin, expired, billing, traffic_limit]

    VpnKey:
      type: object
      required:
        [
          id,
          nodeId,
          nodeName,
          label,
          vlessLink,
          deepLink,
          createdAt,
          trafficUpBytes,
          trafficDownBytes,
          periodUpBytes,
          periodDownBytes,
          periodStartedAt,
          userId,
        ]
      properties:
        id: { type: integer }
        nodeId: { type: integer }
        nodeName: { type: string }
        label: { type: string }
        description: { type: ["string", "null"] }
        vlessLink: { type: string }
        deepLink: { type: string }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        # Why this key was revoked, null while active. See RevokedReason enum
        # for what each value means to the end user.
        revokedReason:
          oneOf:
            - $ref: "#/components/schemas/RevokedReason"
            - type: "null"
        userId: { type: integer }
        userEmail: { type: string }
        # Lifetime traffic counters, in bytes, accumulated from Xray's Stats
        # API by the background polling job (stay 0 if Xray isn't running
        # locally, e.g. in Replit dev).
        trafficUpBytes: { type: integer }
        trafficDownBytes: { type: integer }
        # Traffic since periodStartedAt (reset to 0 on subscription renewal).
        periodUpBytes: { type: integer }
        periodDownBytes: { type: integer }
        periodStartedAt: { type: string, format: date-time }
        # Timestamp of the last observed traffic on this key (from the
        # background Xray stats poller). Null if never seen any traffic.
        lastTrafficAt: { type: ["string", "null"], format: date-time }

    VpnKeyInput:
      type: object
      properties:
        nodeId: { type: integer }
        label: { type: string }
        description: { type: string }

    VpnKeyRenameInput:
      type: object
      properties:
        label: { type: string, minLength: 1 }
        description: { type: string }

    VpnKeyRelocateInput:
      type: object
      required: [nodeId]
      properties:
        nodeId: { type: integer }

    SubscriptionUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }

    BalanceTransactionType:
      type: string
      enum: [topup, debit, refund, referral]

    BalanceTransaction:
      type: object
      required: [id, amountKopecks, type, createdAt]
      properties:
        id: { type: integer }
        amountKopecks: { type: integer }
        type:
          $ref: "#/components/schemas/BalanceTransactionType"
        description: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AdminUser:
      type: object
      required:
        [
          id,
          email,
          role,
          createdAt,
          extraDeviceSlots,
          trafficUpBytes,
          trafficDownBytes,
          periodUpBytes,
          periodDownBytes,
          periodStartedAt,
          trafficLimitGb,
          trafficLimitExceeded,
          extraTrafficGb,
          isOnline,
          vpnLastActiveAt,
          activityStatus,
          balanceKopecks,
          referralCode,
          referredUserCount,
          isBanned,
          isOnTrial,
        ]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: ["string", "null"] }
        balanceKopecks: { type: integer }
        referralCode: { type: string }
        # Who referred this user in, if anyone (null for the root admin).
        referredByEmail: { type: ["string", "null"] }
        # Number of accounts registered using this user's own referral code.
        referredUserCount: { type: integer }
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt: { type: string, format: date-time }
        # Last authenticated request (throttled to ~1/min server-side).
        lastActiveAt: { type: ["string", "null"], format: date-time }
        # true if lastActiveAt is within the last 5 minutes.
        isOnline: { type: boolean }
        # Timestamp of the most recent non-zero VPN traffic delta across all
        # of this user's keys (null if no VPN traffic has ever been recorded).
        vpnLastActiveAt: { type: ["string", "null"], format: date-time }
        # Composite activity status:
        #   "site"    — visited the site in the last 5 min (lastActiveAt fresh)
        #   "vpn"     — VPN traffic in the last 10 min but not on site
        #   "offline" — neither
        activityStatus:
          type: string
          enum: [site, vpn, offline]
        activeSubscriptions: { type: integer }
        # extraDeviceSlots is sourced from the user's currently ACTIVE
        # subscription row (0 if none) — slots do not carry over across
        # renewal/switch. activeSubscriptionId is what the admin extra-slots
        # PATCH targets; null means there is nothing to grant slots against.
        extraDeviceSlots: { type: integer }
        activeSubscriptionId: { type: ["integer", "null"] }
        # Aggregated across all of this user's own VPN keys.
        trafficUpBytes: { type: integer }
        trafficDownBytes: { type: integer }
        periodUpBytes: { type: integer }
        periodDownBytes: { type: integer }
        # Start of the current billing window (reset when subscription renews).
        periodStartedAt: { type: ["string", "null"], format: date-time }
        # From the user's currently active plan, if any; null = no active
        # subscription or an unlimited plan.
        trafficLimitGb: { type: ["integer", "null"] }
        trafficLimitExceeded: { type: boolean }
        # Extra traffic (GB) purchased for the currently active subscription.
        extraTrafficGb: { type: integer }
        # When the current subscription was flagged as exceeded (see
        # trafficLimitExceeded); null while under the cap or with no active
        # subscription.
        trafficLimitExceededAt: { type: ["string", "null"], format: date-time }
        # The user's genuinely active plan right now (status=active, not
        # expired). Use this for any "what plan is this user on" display —
        # e.g. the traffic summary line — since it can never show a
        # cancelled/pending/rejected request as if it were in effect.
        activePlanName: { type: ["string", "null"] }
        activePlanId: { type: ["integer", "null"] }
        # Current (most recently started) subscription, regardless of status,
        # so the admin panel can show what a user has even if it's expired,
        # cancelled, or awaiting payment. Null fields = no subscription at all.
        # This intentionally can differ from activePlanName (e.g. a cancelled
        # downgrade request shows up here with status "cancelled" while
        # activePlanName still reflects the real, unaffected active plan).
        planId: { type: ["integer", "null"] }
        planName: { type: ["string", "null"] }
        subscriptionStatus:
          oneOf:
            - $ref: "#/components/schemas/SubscriptionStatus"
            - type: "null"
        subscriptionEndsAt: { type: ["string", "null"], format: date-time }
        # startsAt of the user's most recent subscription — used in the admin
        # panel to detect hourly subscriptions whose start date is in the future
        # (a billing bug where the subscription was queued to start at the end
        # of a prior monthly sub, so billing never fires because billFrom > now).
        subscriptionStartsAt: { type: ["string", "null"], format: date-time }
        subscriptionBillingType:
          oneOf:
            - $ref: "#/components/schemas/PlanBillingType"
            - type: "null"
        # startsAt and billingType from the user's currently ACTIVE subscription.
        # Unlike subscriptionStartsAt (sourced from the most-recently-created
        # subscription regardless of status — a cancelled/pending row with
        # startsAt=null sorts first in DESC and can mask the real active one),
        # these always reflect the subscription the billing job processes.
        # Used to detect frozen billing: hourly + activeSubscriptionStartsAt in
        # the future → ticksElapsed < 0 → billing silently skips forever.
        activeSubscriptionStartsAt: { type: ["string", "null"], format: date-time }
        activeSubscriptionLastBilledAt: { type: ["string", "null"], format: date-time }
        activeSubscriptionBillingType:
          oneOf:
            - $ref: "#/components/schemas/PlanBillingType"
            - type: "null"
        # Private admin-only memo (never exposed in user-facing endpoints).
        adminNote: { type: ["string", "null"] }
        # true while the account is administratively blocked.
        isBanned: { type: boolean }
        # true when the user's currently active subscription has isTrial=true.
        isOnTrial: { type: boolean }
        # When the trial subscription expires (null if not on trial or no endsAt).
        trialEndsAt: { type: ["string", "null"], format: date-time }

    AdminUserProfileUpdate:
      type: object
      properties:
        name: { type: ["string", "null"] }
        email: { type: string, format: email }

    AdminSubscriptionUpdate:
      type: object
      required: [planId]
      properties:
        planId: { type: integer }
        # Overrides the plan's own durationDays for this activation, so an
        # admin can grant e.g. a custom 7-day trial extension on top of a
        # monthly plan. Defaults to the plan's durationDays when omitted.
        durationDays: { type: integer, minimum: 1 }

    AdminPasswordResetResult:
      type: object
      required: [resetUrl]
      properties:
        resetUrl: { type: string }

    UserRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"

    DashboardSummary:
      type: object
      required: [totalUsers, activeSubscriptions, pendingPayments, monthlyRevenueRub, last30DaysRevenueRub, totalVpnKeys, openTickets, activeNow, activeOnVpn, activeOnSite, expiringIn3Days, lowBalanceHourly, topTrafficUsers, newUsersLast7Days, newUsersLast30Days, planDistribution, revenueByDay, referralCount, referralCommissionsThisMonthRub]
      properties:
        totalUsers: { type: integer }
        activeSubscriptions: { type: integer }
        pendingPayments: { type: integer }
        monthlyRevenueRub: { type: integer }
        last30DaysRevenueRub: { type: integer }
        totalVpnKeys: { type: integer }
        openTickets: { type: integer }
        # Total online = activeOnVpn + activeOnSite (mutually exclusive, mirrors badge logic).
        activeNow: { type: integer }
        # Users whose most recent signal is VPN traffic (lastTrafficAt within 10 min, and more recent than site activity).
        activeOnVpn: { type: integer }
        # Users whose most recent signal is the site (lastActiveAt within 5 min, no fresher VPN signal).
        activeOnSite: { type: integer }
        # Active monthly subscriptions ending within 3 days.
        expiringIn3Days: { type: integer }
        # Active hourly-plan users whose balance covers < 3 hours at their plan rate.
        lowBalanceHourly: { type: integer }
        # Top 5 users by current-period traffic (non-revoked keys), descending.
        topTrafficUsers:
          type: array
          items:
            $ref: "#/components/schemas/TopTrafficUser"
        newUsersLast7Days: { type: integer }
        newUsersLast30Days: { type: integer }
        # Count of currently-active subscriptions grouped by plan name.
        planDistribution:
          type: array
          items:
            $ref: "#/components/schemas/PlanDistributionEntry"
        # Confirmed revenue (rubles) per calendar day, oldest first, for the
        # last 14 days (days with no confirmed payments still appear, with 0).
        revenueByDay:
          type: array
          items:
            $ref: "#/components/schemas/RevenueByDayEntry"
        # Total number of users who registered via a referral link.
        referralCount: { type: integer }
